# cargo-audit configuration. Every ignore is transitive, pinned by an upstream
# we cannot bump. Revisit when a parent drops it.
#
# Run: `cargo audit`

[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa decryption timing; surrealdb -> jsonwebtoken verifies only
    "RUSTSEC-2024-0436", # paste, unmaintained (utoipa-axum)
    "RUSTSEC-2026-0192", # ttf-parser, unmaintained (lopdf via pdfsink-rs)
    "RUSTSEC-2025-0141", # bincode, unmaintained (surrealmx)
    "RUSTSEC-2023-0089", # atomic-polyfill, unmaintained (heapless via surrealdb)
    "RUSTSEC-2026-0367", # zip extract() only; calamine reads entries in memory
    "RUSTSEC-2026-0368", # zip extract() only
    "RUSTSEC-2026-0369", # zip extract() only
    "RUSTSEC-2025-0052", # async-std discontinued; async-imap needs it for imap-proto 0.16
    "RUSTSEC-2026-0387", # crypto-bigint timing; verify-only path, no bump available
]
