# cargo-audit configuration. Every ignore is transitive, pinned by an upstream
# we cannot bump. Revisit when a parent drops it.
#
# Run: `cargo audit`

[advisories]
ignore = [
    # SQLite < 3.54.0 can return stale page-cache bytes when a crafted db + `-wal`
    # sibling pair is opened. Local vector only: it needs someone able to write
    # `/data` next to our db. Bundled SQLite comes from `libsqlite3-sys` (via
    # sqlx-sqlite) and no release there bundles 3.54 yet.
    "RUSTSEC-2026-0459", # libsqlite3-sys <- sqlx-sqlite 0.9 (bundles SQLite 3.53)
    # Unmaintained notices (no vulnerability, no upgrade path from us):
    "RUSTSEC-2024-0436", # paste       <- utoipa-axum 0.3.0 (latest)
    "RUSTSEC-2026-0192", # ttf-parser  <- lopdf 0.42, pinned by pdfsink-rs 0.2.19 (latest)
]
