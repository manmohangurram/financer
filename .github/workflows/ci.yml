name: CI

# Runs the full merge gate on pull requests only: Rust build, clippy
# (-D warnings), unit tests (both feature sets), frontend type-check + vitest.
on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared by every job so the surreal build reuses the default artifacts.
          shared-key: backend

      # Default build (SQLite only): fast gate for the shipping configuration.
      - name: Check (default features)
        run: cargo check --locked

      # Full build: compiles the SurrealDB backend too.
      - name: Clippy (all features)
        run: cargo clippy --all-targets --features surreal -- -D warnings

      - name: Test (all features)
        run: cargo test --features surreal

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Cache vite's transform cache + vue-tsc incremental build info so
      # type-check and build reuse prior work across runs.
      - name: Cache vite + vue-tsc
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.vite
            frontend/*.tsbuildinfo
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json') }}

      - name: Type-check
        run: npx vue-tsc -b
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
