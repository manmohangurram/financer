name: CI

# The merge gate: Rust clippy (-D warnings) + tests, frontend type-check,
# vitest and build. Runs on pull requests, and on pushes to main because that
# run is what saves the cargo cache every PR then restores — with PR-only
# triggers each PR started cold and re-downloaded the whole registry.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Cache vite's transform cache + vue-tsc incremental build info so
      # type-check and build reuse prior work across runs.
      - name: Cache vite + vue-tsc
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.vite
            frontend/*.tsbuildinfo
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json') }}

      - name: Type-check
        run: npx vue-tsc -b
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
