name: CI

# Runs the full merge gate on every PR and push to main: Rust build, clippy
# (-D warnings), unit tests, frontend type-check + vitest + build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Fast compile gate — `cargo check` is much quicker than a full build.
      # `cargo clippy` below full-compiles, so no separate `cargo build` needed.
      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Cache vite's transform cache + vue-tsc incremental build info so
      # type-check and build reuse prior work across runs.
      - name: Cache vite + vue-tsc
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.vite
            frontend/*.tsbuildinfo
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json') }}

      - name: Type-check
        run: npx vue-tsc -b
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
