name: CI

# The merge gate: Go formatting/vet/build/tests/vulnerability scan plus frontend
# type-check, vitest and build. Runs on pull requests, and on pushes to main
# because that run warms the Go and npm caches every PR restores.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt is not part of `go vet`; fail on any file that needs rewriting.
      - name: Formatting
        run: |
          unformatted="$(gofmt -l cmd internal migrate.go)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Cache vite's transform cache + vue-tsc incremental build info so
      # type-check and build reuse prior work across runs.
      - name: Cache vite + vue-tsc
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/.vite
            frontend/*.tsbuildinfo
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json') }}

      - name: Type-check
        run: npx vue-tsc -b
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # The image is only published on tags, so validate the Dockerfile on every PR.
  # Both build stages run on BUILDPLATFORM and cross-compile; the arm64 runtime
  # base is only pulled, so no QEMU is needed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
