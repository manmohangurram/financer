# Financer — self-host setup: one container, SQLite storage, no external services.
#
#   docker compose up -d
#
# Settings come from environment variables (see .env.example and README.md).
# Copy .env.example to .env to override them.
services:
  financer:
    image: ghcr.io/manmohangurram/financer:${IMAGE_TAG:-latest}
    container_name: financer
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      FINANCER_SQLITE_PATH: ${FINANCER_SQLITE_PATH:-/data/financer.db}
      # Required: a stable JWT secret (e.g. `openssl rand -hex 32`).
      FINANCER_JWT_SECRET: ${FINANCER_JWT_SECRET:?set FINANCER_JWT_SECRET}
      # Container clock and the app's date/time zone.
      TZ: ${TZ:-Asia/Kolkata}
      FINANCER_TIMEZONE: ${TZ:-Asia/Kolkata}
      # Logging: stderr (docker logs) by default; set a path to append to a file.
      FINANCER_LOG_LEVEL: ${FINANCER_LOG_LEVEL:-info}
      FINANCER_LOG_FILE: ${FINANCER_LOG_FILE:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
