<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Financer — a personal finance tracker for accounts, transactions, investments, and spending." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Financer</title>
    <script>
      // Apply the persisted theme before the bundle loads to avoid a flash.
      (function () {
        var t = localStorage.getItem('financer-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
