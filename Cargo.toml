[package]
name = "financer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Financer personal finance tracker backend (Rust) — strangler replacement for the Go backend"
license = "0BSD"
repository = "https://github.com/manmohangurram/financer"
default-run = "financer"

[features]
# SurrealDB storage backend. Off by default: SQLite-only builds skip the whole
# `surrealdb` dependency tree. Enable with `--features surreal`.
default = []
surreal = ["dep:surrealdb"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 1.99 wants `assert_eq!(x, vec![])` over `assert!(x.is_empty())`; the suggested
# form is noisier and shows nothing extra.
assert_is_empty = "allow"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
surrealdb = { version = "3", features = ["kv-mem", "protocol-http"], optional = true }
thiserror = "2"
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
strum = { version = "0.26", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
rand = "0.8"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", features = ["derive"] }
http = "1"
chrono-tz = "0.10.4"
csv = "1.4.0"
calamine = { version = "0.36.1", features = ["dates"] }
pdfsink-rs = "0.2.19"
async-imap = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["compat"] }
# rustls, not native-tls: the runtime image has no OpenSSL. Roots are bundled
# at compile time so TLS does not depend on the OS trust store existing.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = "0.26"
webpki-roots = "1.0"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
