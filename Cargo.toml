[package]
name = "financer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Financer personal finance tracker backend (Rust) — strangler replacement for the Go backend"
license = "0BSD"
repository = "https://github.com/manmohangurram/financer"
default-run = "financer"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
surrealdb = { version = "3", features = ["kv-mem", "protocol-http"] }
thiserror = "2"
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
strum = { version = "0.26", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
rand = "0.8"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", features = ["derive"] }
http = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
